name: Build Android APK

# Run it by hand: repo > Actions tab > "Build Android APK" > Run workflow
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet==1.0.4" "flet-cli==1.0.4"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK
        run: flet build apk --verbose

      - name: Show what was built
        if: always()
        run: find build -maxdepth 5 -name "*.apk" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: BCT-Tuition-Calculator-apk
          path: build/apk/*.apk
